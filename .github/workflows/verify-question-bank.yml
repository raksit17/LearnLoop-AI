name: Verify Question Bank (temporary)
on:
  push:
    branches: [feat/learning-question-bank]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API clean install, compile, unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Nuxt clean install and build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Full Docker integration with Question Bank previews
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          node <<'NODE'
          const assert = require("node:assert/strict");
          const base = "http://127.0.0.1:4318/v1/";
          async function req(path, body, headers = {}) {
            const r = await fetch(base + path, {
              method: body === undefined ? "GET" : "POST",
              headers: { ...(body === undefined ? {} : {"Content-Type":"application/json", Origin:"http://127.0.0.1:4318"}), ...headers },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            return { status:r.status, body:await r.json(), cookie:r.headers.get("set-cookie") };
          }
          (async () => {
            const state = await req("state");
            assert.equal(state.status, 200);
            const goal = await req("goals", {title:"ทดสอบคลังคำถาม",domain:"Programming"});
            assert.equal(goal.status, 201, JSON.stringify(goal.body));
            const topic = await req("topics", {goalId:goal.body.id,title:"Node.js"});
            assert.equal(topic.status, 201, JSON.stringify(topic.body));
            const question = await req("questions", {topicId:topic.body.id,prompt:"Event loop คืออะไร?",key:"จัดการงานอะซิงโครนัส",hint:"นึกถึง task queue",kind:"recall"});
            assert.equal(question.status, 201, JSON.stringify(question.body));
            const snapshot = await req("state");
            const listed = snapshot.body.questions.find(x=>x.id===question.body.id);
            assert.ok(listed, "question is in the bank");
            assert.equal(listed.sourceId, null, "manual question source should be null");
            assert.ok(!Object.hasOwn(listed,"key"), "avoid leaking answers in state");
            const preview = await req("questions/"+question.body.id+"/preview");
            assert.equal(preview.status, 200, JSON.stringify(preview.body));
            assert.equal(preview.body.key,"จัดการงานอะซิงโครนัส");
            assert.equal(preview.body.hint,"นึกถึง task queue");
            assert.equal(preview.body.source,null);
            const invalid = await req("questions/not-a-uuid/preview");
            assert.equal(invalid.status,400);
            console.log("Question Bank demo API smoke passed");
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          DEV_AUTH_BYPASS=false docker compose up -d --force-recreate api --wait
          node <<'NODE'
          const assert = require("node:assert/strict");
          const base="http://127.0.0.1:4318/v1/";
          async function request(path,body,cookie){
            const resp=await fetch(base+path,{
              method:body===undefined?"GET":"POST",
              headers:{...(body===undefined?{}:{"Content-Type":"application/json", Origin:"http://127.0.0.1:4318"}),...(cookie?{Cookie:cookie}:{})},
              body:body===undefined?undefined:JSON.stringify(body)
            });
            const data=await resp.json();
            return {status:resp.status,body:data,cookie:resp.headers.get("set-cookie")?.split(";")[0]};
          }
          (async()=>{
            assert.equal((await request("state")).status,401);
            const account1=await request("register",{name:"A",email:"a-question-bank@example.test",password:"devpass123"});
            const account2=await request("register",{name:"B",email:"b-question-bank@example.test",password:"devpass123"});
            assert.equal(account1.status,201,JSON.stringify(account1.body));
            assert.equal(account2.status,201,JSON.stringify(account2.body));
            const g=await request("goals",{title:"A Goal",domain:"Programming"},account1.cookie);
            const t=await request("topics",{goalId:g.body.id,title:"Private Topic"},account1.cookie);
            const q=await request("questions",{topicId:t.body.id,prompt:"Only A question",key:"private answer",kind:"recall"},account1.cookie);
            assert.equal(q.status,201,JSON.stringify(q.body));
            const uri="questions/"+q.body.id+"/preview";
            assert.equal((await request(uri,undefined)).status,401);
            assert.equal((await request(uri,undefined,account2.cookie)).status,404);
            assert.equal((await request(uri,undefined,account1.cookie)).body.key,"private answer");
            console.log("Question Bank ownership checks passed");
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Docker logs if failing
        if: failure()
        run: docker compose logs --tail=100 || true
