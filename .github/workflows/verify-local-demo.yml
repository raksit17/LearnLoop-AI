name: Verify temporary local demo mode
on:
  push:
    branches: [feat/local-demo-without-login]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Nuxt clean build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Compose startup and no-login smoke test
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          node <<'NODE'
          const assert = require("node:assert/strict");
          const root = "http://127.0.0.1:4318";
          (async () => {
            const health = await fetch(root + "/v1/health");
            assert.equal(health.status, 200);
            const h = await health.json();
            assert.equal(h.demo, true, "demo enabled for local stack");
            const state = await fetch(root + "/v1/state");
            assert.equal(state.status, 200, "unauthenticated state should work in demo mode");
            const s = await state.json();
            assert.equal(s.user.name, "ผู้เรียนทดลอง");
            const request = await fetch(root + "/v1/goals", {
              method: "POST",
              headers: { "Content-Type": "application/json", Origin: root },
              body: JSON.stringify({ title: "ทดลองเรียน TypeScript", domain: "Programming" }),
            });
            assert.equal(request.status, 201, await request.text().catch(() => ""));
            const disallowed = await fetch(root + "/v1/goals", {
              method: "POST",
              headers: { "Content-Type": "application/json", Origin: "https://untrusted.example" },
              body: JSON.stringify({ title: "must fail", domain: "Programming" }),
            });
            assert.equal(disallowed.status, 403, "reject cross-site writes");
            console.log("Local demo smoke test passed");
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose logs --tail=100 || true
