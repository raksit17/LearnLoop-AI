name: Repair LearnLoop web lockfile
on:
  push:
    branches:
      - fix/web-npm-lock-docker-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate web lockfile with npm
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated web lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(web): synchronize npm lockfile for Docker build"
            git push origin HEAD:fix/web-npm-lock-docker-build
          fi
      - name: Validate clean install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Validate Nuxt production build
        working-directory: apps/web
        run: npm run build
      - name: Verify Docker Compose image builds (web, API, worker)
        run: |
          cp .env.example .env
          docker compose build
