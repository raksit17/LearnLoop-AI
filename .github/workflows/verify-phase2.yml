name: Verify Phase 2 reading aid and mindmap
on:
  push:
    branches: [feat/ai-reading-aid-mindmap-cache]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API clean install, compile, and unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Nuxt clean install and production build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Docker Compose startup and PostgreSQL artifact caching
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          docker compose exec -T api node <<'NODE'
          const assert = require("node:assert/strict");
          const {PrismaClient}=require("@prisma/client");
          const provider=require("./dist/ai/provider");
          const {processJob}=require("./dist/process-job");
          const db=new PrismaClient();
          const key="phase2-"+Date.now();
          const aid={
            title:"Spaced Repetition",summary:"ทบทวนหลายช่วงเวลาเพื่อให้จำข้อมูลได้ดีขึ้นในระยะยาว",
            sections:[{heading:"แนวคิด",explanation:"ทบทวนด้วยช่วงเวลาห่างกันเพื่อการจดจำ",bullets:["อ่านก่อน","ทบทวนหลัง"]}],
            keyPoints:["เรียนและทบทวน","พักก่อนกลับมาทดสอบ"],
            glossary:[{term:"Spacing",meaning:"การเว้นช่วงเวลาทบทวน"}]
          };
          const map={root:"การทบทวน",branches:[
            {label:"ขั้นตอน",children:["ศึกษา","ทดสอบตนเอง"]},
            {label:"หลักการ",children:["เว้นระยะ","ฝึกนึก"]},
          ]};
          let calls=0;
          provider.ask=async(task,params)=>{
            assert.equal(params.excerpt,"การฝึกทบทวนแบบเว้นระยะ");
            calls++;
            return task==="reading-aid"?aid:map;
          };
          (async()=>{
            const u=await db.user.upsert({where:{identity:"demo:local"},create:{identity:"demo:local",name:"ผู้เรียนทดลอง"},update:{}});
            const g=await db.goal.create({data:{userId:u.id,title:key,domain:"General"}});
            const t=await db.topic.create({data:{goalId:g.id,title:key}});
            const s=await db.source.create({data:{topicId:t.id,title:key,chunks:["การฝึกทบทวนแบบเว้นระยะ"]}});
            const job=(name)=>({name,id:key+"-"+name,data:{userId:u.id,resourceId:s.id,section:0,minutes:30}});
            const first=await processJob(db,job("reading-aid"));
            assert.equal(first.cached,false);
            assert.equal(first.kind,"reading_aid");
            assert.equal(first.payload.title,aid.title);
            const again=await processJob(db,job("reading-aid"));
            assert.equal(again.cached,true);
            assert.deepEqual(again.payload,aid);
            const mind=await processJob(db,job("mindmap"));
            assert.equal(mind.cached,false);
            const mindAgain=await processJob(db,job("mindmap"));
            assert.equal(mindAgain.cached,true);
            assert.deepEqual(mindAgain.payload,map);
            assert.equal(calls,2,"cache avoids extra AI calls");
            const count=await db.sourceArtifact.count({where:{sourceId:s.id}});
            assert.equal(count,2);
            const base="http://web:3000/v1/sources/"+s.id+"/artifacts";
            const response=await fetch(base+"?section=0&kind=reading_aid");
            assert.equal(response.status,200);
            const data=await response.json();
            assert.equal(data.payload.title,aid.title);
            const mapResponse=await fetch(base+"?section=0&kind=mindmap");
            assert.equal(mapResponse.status,200);
            assert.equal((await mapResponse.json()).payload.root,map.root);
            const invalid=await fetch(base+"?section=99&kind=mindmap");
            assert.equal(invalid.status,400);
            console.log("Verified cache, API, invalid section and no repeated AI calls. Source: "+s.id);
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(()=>db.$disconnect());
          NODE
      - name: Ownership / unauthenticated access checks
        run: |
          DEV_AUTH_BYPASS=false docker compose up -d --force-recreate api --wait
          node <<'NODE'
          const assert=require("node:assert/strict");
          const base="http://127.0.0.1:4318/v1/";
          (async()=>{
            assert.equal((await fetch(base+"state")).status,401);
            const register=await fetch(base+"register",{
              method:"POST",
              headers:{"Content-Type":"application/json",Origin:"http://127.0.0.1:4318"},
              body:JSON.stringify({name:"Guest",email:"phase2-"+Date.now()+"@example.test",password:"testpass123"}),
            });
            assert.equal(register.status,201);
            const cookie=register.headers.get("set-cookie").split(";")[0];
            const state=await fetch(base+"state",{headers:{Cookie:cookie}});
            assert.equal(state.status,200);
            const goal=await fetch(base+"goals",{method:"POST",headers:{Cookie:cookie,Origin:"http://127.0.0.1:4318","Content-Type":"application/json"},body:JSON.stringify({title:"Sample",domain:"General"})});
            const gid=(await goal.json()).id;
            const topic=await fetch(base+"topics",{method:"POST",headers:{Cookie:cookie,Origin:"http://127.0.0.1:4318","Content-Type":"application/json"},body:JSON.stringify({goalId:gid,title:"Owned"})});
            const tid=(await topic.json()).id;
            const src=await fetch(base+"sources",{method:"POST",headers:{Cookie:cookie,Origin:"http://127.0.0.1:4318","Content-Type":"application/json"},body:JSON.stringify({topicId:tid,title:"Owned Source",body:"Source content"})});
            assert.equal(src.status,201);
            const sid=(await src.json()).id;
            const url=base+"sources/"+sid+"/artifacts?section=0&kind=reading_aid";
            assert.equal((await fetch(url)).status,401);
            const owned=await fetch(url,{headers:{Cookie:cookie}});
            assert.equal(owned.status,200);
            assert.equal((await owned.json()).payload,null);
            const second=await fetch(base+"register",{
              method:"POST",
              headers:{"Content-Type":"application/json",Origin:"http://127.0.0.1:4318"},
              body:JSON.stringify({name:"Other",email:"phase2-other-"+Date.now()+"@example.test",password:"testpass123"}),
            });
            assert.equal(second.status,201);
            const otherCookie=second.headers.get("set-cookie").split(";")[0];
            assert.equal((await fetch(url,{headers:{Cookie:otherCookie}})).status,404);
            console.log("Verified owner-only source artifact access");
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Diagnostics if failing
        if: failure()
        run: docker compose logs --tail=120 || true
