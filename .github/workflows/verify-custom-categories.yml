name: Verify custom learning goal categories
on:
  push:
    branches: [feat/custom-goal-categories]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API build and unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Nuxt production build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Docker, migration, category lifecycle tests
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          node <<'NODE'
          const assert = require("node:assert/strict");
          const root="http://127.0.0.1:4318/v1/";
          const origin="http://localhost:4318";
          async function req(path,body,method="POST",cookie,from=origin) {
            const r=await fetch(root+path,{method:body===undefined?"GET":method,
              headers:{...(body===undefined?{}:{"Content-Type":"application/json",Origin:from}),...(cookie?{Cookie:cookie}:{})},
              body:body===undefined?undefined:JSON.stringify(body)});
            return {status:r.status,data:await r.json(),cookie:r.headers.get("set-cookie")?.split(";")[0]};
          }
          async function check(path,body,method,status,cookie,from) {
            const result=await req(path,body,method,cookie,from);
            assert.equal(result.status,status,JSON.stringify({path,result}));
            return result.data;
          }
          (async()=>{
            const state=await req("state");
            assert.equal(state.status,200);
            assert.deepEqual(state.data.categories.map(c=>c.name),["General","Programming","English"]);
            await check("goals",{title:"No free-text arbitrary domains",domain:"Backend"},"POST",400);
            const custom=await check("goal-categories",{name:"  Backend  Development "},"POST",201);
            assert.equal(custom.name,"Backend Development");
            await check("goal-categories",{name:"backend development"},"POST",409);
            await check("goal-categories",{name:" Programming "},"POST",409);
            const goal=await check("goals",{title:"Study Node.js",domain:custom.name},"POST",201);
            assert.equal(goal.domain,custom.name);
            const renamed=await check("goal-categories/"+custom.id,{name:"AI Engineering"},"PATCH",200);
            assert.equal(renamed.name,"AI Engineering");
            let snapshot=await check("state",undefined,"GET",200);
            assert.equal(snapshot.goals.find(g=>g.id===goal.id).domain,"AI Engineering");
            assert.ok(snapshot.categories.some(c=>c.name==="AI Engineering"));
            await check("goal-categories/"+custom.id,{confirmName:"AI Engineering"},"DELETE",409);
            const goalUpdated=await check("goals/"+goal.id,{title:"Study AI",domain:"Programming"},"PATCH",200);
            assert.equal(goalUpdated.domain,"Programming");
            await check("goal-categories/"+custom.id,{confirmName:"Wrong"},"DELETE",409);
            const invalidOrigin=await req("goal-categories/"+custom.id,{confirmName:"AI Engineering"},"DELETE",undefined,"https://untrusted.example");
            assert.equal(invalidOrigin.status,403);
            await check("goal-categories/"+custom.id,{confirmName:"AI Engineering"},"DELETE",200);
            snapshot=await check("state",undefined,"GET",200);
            assert.equal(snapshot.categories.length,3);
            assert.equal(snapshot.goals.find(g=>g.id===goal.id).domain,"Programming");
            await check("goal-categories/"+custom.id,{confirmName:"AI Engineering"},"DELETE",404);
            const again=await check("goal-categories",{name:"ภาษาญี่ปุ่น"},"POST",201);
            await check("goals",{title:"Japanese N4",domain:again.name},"POST",201);
            console.log("Custom category create, duplicate prevention, rename cascade, safe delete, defaults, ownership of goals passed");
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Test owner isolation and built-ins without demo mode
        run: |
          DEV_AUTH_BYPASS=false docker compose up -d --force-recreate api --wait
          node <<'NODE'
          const assert=require("node:assert/strict");
          const root="http://127.0.0.1:4318/v1/";
          const origin="http://localhost:4318";
          async function req(path,body,method="POST",cookie){
            const r=await fetch(root+path,{method:body===undefined?"GET":method,
              headers:{...(body===undefined?{}:{"Content-Type":"application/json",Origin:origin}),...(cookie?{Cookie:cookie}:{})},
              body:body===undefined?undefined:JSON.stringify(body)});
            return {status:r.status,data:await r.json(),cookie:r.headers.get("set-cookie")?.split(";")[0]};
          }
          (async()=>{
            const email=()=>Math.random().toString(36).slice(2)+"@example.test";
            const a=await req("register",{name:"A",email:email(),password:"testpass123"});
            const b=await req("register",{name:"B",email:email(),password:"testpass123"});
            assert.equal(a.status,201);
            assert.equal(b.status,201);
            const cat=await req("goal-categories",{name:"Private Subject"},"POST",a.cookie);
            assert.equal(cat.status,201,JSON.stringify(cat.data));
            const id=cat.data.id;
            assert.equal((await req("goal-categories/"+id,{name:"stolen"},"PATCH",b.cookie)).status,404);
            assert.equal((await req("goal-categories/"+id,{confirmName:"Private Subject"},"DELETE",b.cookie)).status,404);
            assert.equal((await req("goal-categories/"+id,{name:"stolen"},"PATCH")).status,401);
            assert.equal((await req("goal-categories/"+id,{confirmName:"Private Subject"},"DELETE")).status,401);
            assert.equal((await req("goals",{title:"Not mine",domain:"Private Subject"},"POST",b.cookie)).status,400);
            const state=await req("state",undefined,"GET",b.cookie);
            assert.equal(state.status,200);
            assert.equal(state.data.categories.length,3,"other account cannot see private category");
            assert.equal((await req("goal-categories/"+id,{confirmName:"Private Subject"},"DELETE",a.cookie)).status,200);
            console.log("Category isolation, forbidden cross-user edits and built-in availability passed");
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose logs --tail=120 || true
