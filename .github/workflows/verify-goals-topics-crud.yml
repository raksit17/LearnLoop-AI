name: Verify goals/topics CRUD
on:
  push:
    branches: [feat/goals-topics-crud-table]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API compile and unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Nuxt production build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Docker integration: CRUD, confirmation and cascading relations
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          docker compose exec -T api node <<'NODE'
          const assert = require("node:assert/strict");
          const { randomUUID } = require("node:crypto");
          const { PrismaClient } = require("@prisma/client");
          const db = new PrismaClient();
          const root = "http://web:3000/v1/";
          async function request(path, body, method = "POST", origin = "http://localhost:4318") {
            const response = await fetch(root + path, {
              method: body === undefined ? "GET" : method,
              headers: body === undefined ? {} : {
                Origin: origin, "Content-Type": "application/json",
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const data = await response.json();
            return { status: response.status, body: data };
          }
          async function expectStatus(path, body, method, status) {
            const response = await request(path, body, method);
            assert.equal(response.status, status, JSON.stringify({path, response}));
            return response.body;
          }
          (async () => {
            const other = await expectStatus("goals", {title:"Keep this goal",domain:"General"}, "POST", 201);
            const g = await expectStatus("goals", {title:"เทส",domain:"General"}, "POST", 201);
            const t = await expectStatus("topics", {goalId:g.id,title:"ฟด"}, "POST", 201);
            const connected = await expectStatus("topics", {goalId:g.id,title:"อีกหัวข้อ"}, "POST", 201);
            const src = await expectStatus("sources", {topicId:t.id,title:"Lesson",body:"Sample lesson content"}, "POST", 201);
            const q = await expectStatus("questions", {topicId:t.id,prompt:"ตัวอย่างคำถาม?",key:"คำตอบ",kind:"recall"}, "POST", 201);
            await db.sourceArtifact.create({data:{sourceId:src.id,section:0,kind:"reading_aid",payload:{summary:"Testing"}}});
            await db.attempt.create({data:{questionId:q.id,answer:"test",confidence:3,hint:false,seconds:10,request:randomUUID()}});
            await db.studySession.create({data:{topicId:t.id,plan:[],evidence:["sample"]}});
            await expectStatus("links",{src:t.id,dst:connected.id,kind:"related"},"POST",201);
            const updated = await expectStatus("goals/"+g.id,{title:"เทสอัปเดต",domain:"Programming"},"PATCH",200);
            assert.equal(updated.title,"เทสอัปเดต");
            assert.equal(updated.domain,"Programming");
            const changedTopic = await expectStatus("topics/"+t.id,{title:"ฟดแก้ไขแล้ว"},"PATCH",200);
            assert.equal(changedTopic.title,"ฟดแก้ไขแล้ว");
            await expectStatus("topics/"+t.id,{confirmTitle:"wrong"},"DELETE",409);
            const csrf = await request("topics/"+t.id,{confirmTitle:"ฟดแก้ไขแล้ว"},"DELETE","https://bad.example");
            assert.equal(csrf.status,403,"DELETE must enforce origin check");
            await expectStatus("topics/"+t.id,{confirmTitle:"ฟดแก้ไขแล้ว"},"DELETE",200);
            assert.equal(await db.topic.count({where:{id:t.id}}),0);
            assert.equal(await db.source.count({where:{id:src.id}}),0);
            assert.equal(await db.sourceArtifact.count({where:{sourceId:src.id}}),0);
            assert.equal(await db.question.count({where:{id:q.id}}),0);
            assert.equal(await db.attempt.count({where:{questionId:q.id}}),0);
            assert.equal(await db.studySession.count({where:{topicId:t.id}}),0);
            assert.equal(await db.link.count({where:{src:t.id}}),0);
            assert.equal(await db.topic.count({where:{id:connected.id}}),1,"sibling topic must survive");
            const second = await expectStatus("topics",{goalId:g.id,title:"ลบพร้อมเป้าหมาย"},"POST",201);
            const s2 = await expectStatus("sources",{topicId:second.id,title:"Extra",body:"Sample"},"POST",201);
            const q2 = await expectStatus("questions",{topicId:second.id,prompt:"Q2?",key:"A2",kind:"recall"},"POST",201);
            await db.attempt.create({data:{questionId:q2.id,answer:"test",confidence:4,hint:false,seconds:10,request:randomUUID()}});
            await db.studySession.create({data:{topicId:second.id,plan:[],evidence:[]}});
            await expectStatus("goals/"+g.id,{confirmTitle:"เทส"},"DELETE",409);
            await expectStatus("goals/"+g.id,{confirmTitle:"เทสอัปเดต"},"DELETE",200);
            assert.equal(await db.goal.count({where:{id:g.id}}),0);
            assert.equal(await db.topic.count({where:{goalId:g.id}}),0);
            assert.equal(await db.source.count({where:{id:s2.id}}),0);
            assert.equal(await db.question.count({where:{id:q2.id}}),0);
            assert.equal(await db.attempt.count({where:{questionId:q2.id}}),0);
            assert.equal(await db.studySession.count({where:{topicId:second.id}}),0);
            assert.equal(await db.goal.count({where:{id:other.id}}),1,"different goal must remain");
            await expectStatus("goals/"+g.id,{confirmTitle:"เทสอัปเดต"},"DELETE",404);
            const remaining = await request("state");
            assert.equal(remaining.status,200);
            assert.ok(!remaining.body.goals.some(x=>x.id===g.id));
            assert.ok(remaining.body.goals.some(x=>x.id===other.id));
            console.log("CRUD, names, CSRF, cascading deletes and surviving unrelated data passed");
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(()=>db.$disconnect());
          NODE
      - name: Cross-user access and empty state
        run: |
          DEV_AUTH_BYPASS=false docker compose up -d --force-recreate api --wait
          node <<'NODE'
          const assert=require("node:assert/strict");
          const root="http://127.0.0.1:4318/v1/";
          const origin="http://localhost:4318";
          async function request(path,body,method="POST",cookie) {
            const r=await fetch(root+path,{
              method:body===undefined?"GET":method,
              headers:{...(body===undefined?{}:{"Content-Type":"application/json",Origin:origin}),...(cookie?{Cookie:cookie}:{})},
              body:body===undefined?undefined:JSON.stringify(body),
            });
            return {status:r.status,body:await r.json(),cookie:r.headers.get("set-cookie")?.split(";")[0]};
          }
          (async()=>{
            const first=await request("register",{name:"Owner",email:"owner-crud-"+Date.now()+"@example.test",password:"testpass123"});
            const second=await request("register",{name:"Other",email:"other-crud-"+Date.now()+"@example.test",password:"testpass123"});
            assert.equal(first.status,201,JSON.stringify(first.body));
            assert.equal(second.status,201,JSON.stringify(second.body));
            const goal=await request("goals",{title:"Private Goal",domain:"General"},"POST",first.cookie);
            assert.equal(goal.status,201);
            const topic=await request("topics",{goalId:goal.body.id,title:"Private Topic"},"POST",first.cookie);
            assert.equal(topic.status,201);
            for (const [path,body,method] of [
              ["goals/"+goal.body.id,{title:"stolen",domain:"General"},"PATCH"],
              ["topics/"+topic.body.id,{title:"stolen"},"PATCH"],
              ["goals/"+goal.body.id,{confirmTitle:"Private Goal"},"DELETE"],
              ["topics/"+topic.body.id,{confirmTitle:"Private Topic"},"DELETE"],
            ]) {
              assert.equal((await request(path,body,method,second.cookie)).status,404,"another account cannot edit/delete");
              assert.equal((await request(path,body,method)).status,401,"anonymous cannot edit/delete");
            }
            assert.equal((await request("topics/"+topic.body.id,{confirmTitle:"Private Topic"},"DELETE",first.cookie)).status,200);
            assert.equal((await request("goals/"+goal.body.id,{confirmTitle:"Private Goal"},"DELETE",first.cookie)).status,200);
            const result=await request("state",undefined,"GET",first.cookie);
            assert.equal(result.status,200);
            assert.equal(result.body.goals.length,0,"last goal deletion allowed");
            console.log("Ownership protection and zero-goal state passed");
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Docker diagnostics on failure
        if: failure()
        run: docker compose logs --tail=120 || true
