name: Verify full lesson summary
on:
  push:
    branches: [feat/full-lesson-eight-part-summary]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API clean install, build and unit tests
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Nuxt clean build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Docker/Prisma integration with eight parts and resumed cache
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          docker compose exec -T api node <<'NODE'
          const assert = require('node:assert/strict');
          const {PrismaClient} = require('@prisma/client');
          const db = new PrismaClient();
          const provider = require('./dist/ai/provider');
          const {processJob} = require('./dist/process-job');
          let calls = 0;
          provider.ask = async (_task, input) => {
            calls++;
            assert.equal(_task, 'reading-aid');
            const idx = Number(input.excerpt.match(/SECTION_(\d+)/)[1]);
            return {
              title: 'บท '+idx,
              summary: 'นี่คือรายละเอียดสรุปของ Present Simple ส่วนที่ '+idx+' ครบตามข้อความที่นำเข้า',
              sections:[{heading:'หัวข้อ '+idx,explanation:'อธิบายหัวข้อ '+idx+' จากข้อความบทเรียน',bullets:['ฝึกสร้างประโยคจากส่วน '+idx]}],
              keyPoints:['ส่วน '+idx+' มีแนวคิดสำคัญ','ต้องฝึกทบทวน'],
              glossary:[],
            };
          };
          const base = 'http://web:3000/v1/';
          (async () => {
            const response = await fetch(base+'state');
            const state = await response.json();
            assert.equal(response.status, 200);
            const userId = state.user.id;
            const goal = await db.goal.create({data:{userId,title:'Full Summary Test',domain:'English'}});
            const topic = await db.topic.create({data:{goalId:goal.id,title:'Present Simple'}});
            const chunks = Array.from({length:8},(_,i)=>'SECTION_'+(i+1)+' - ตัวอย่างเนื้อหาของส่วนที่ '+(i+1));
            const source = await db.source.create({data:{topicId:topic.id,title:'Present Simple Tense',chunks}});
            const url = base+'sources/'+source.id+'/artifacts?kind=reading_aid&scope=all';
            async function getAll() {
              const r = await fetch(url);
              assert.equal(r.status,200);
              return r.json();
            }
            let overview = await getAll();
            assert.equal(overview.total,8);
            assert.equal(overview.items.length,0);
            for (let i=0; i<3; i++) {
              const result = await processJob(db,{name:'reading-aid',id:'part-'+i,data:{userId,resourceId:source.id,section:i,minutes:30}});
              assert.equal(result.cached,false);
            }
            overview=await getAll();
            assert.deepEqual(overview.items.map(x=>x.section),[0,1,2]);
            for (let i=0; i<8; i++) {
              const result = await processJob(db,{name:'reading-aid',id:'resume-'+i,data:{userId,resourceId:source.id,section:i,minutes:30}});
              assert.equal(result.section,i);
              assert.equal(result.cached,i<3);
            }
            overview=await getAll();
            assert.equal(overview.total,8);
            assert.equal(overview.items.length,8);
            assert.deepEqual(overview.items.map(x=>x.section),[0,1,2,3,4,5,6,7]);
            assert.equal(overview.items[7].payload.title,'บท 8');
            assert.equal(calls,8,'each section generated only once');
            const single=await fetch(base+'sources/'+source.id+'/artifacts?kind=reading_aid&section=7');
            assert.equal(single.status,200);
            assert.equal((await single.json()).payload.title,'บท 8');
            const unsupported=await fetch(base+'sources/'+source.id+'/artifacts?kind=mindmap&scope=all');
            assert.equal(unsupported.status,400);
            const badScope=await fetch(base+'sources/'+source.id+'/artifacts?kind=reading_aid&scope=everything');
            assert.equal(badScope.status,400);
            console.log('Whole lesson, 8 sections, partial/resume, cached reuse and validation passed: '+source.id);
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(()=>db.$disconnect());
          NODE
      - name: Owner isolation for bulk summaries
        run: |
          DEV_AUTH_BYPASS=false docker compose up -d --force-recreate api --wait
          node <<'NODE'
          const assert = require('node:assert/strict');
          const base='http://127.0.0.1:4318/v1/';
          async function request(path, body, cookie) {
            const r=await fetch(base+path,{method:body?'POST':'GET',
              headers:{...(body?{'Content-Type':'application/json',Origin:'http://localhost:4318'}:{}),...(cookie?{Cookie:cookie}:{})},
              body:body?JSON.stringify(body):undefined});
            return {status:r.status,data:await r.json(),cookie:r.headers.get('set-cookie')?.split(';')[0]};
          }
          (async()=>{
            const a=await request('register',{name:'A',email:'whole-a-'+Date.now()+'@example.test',password:'testing123'});
            const b=await request('register',{name:'B',email:'whole-b-'+Date.now()+'@example.test',password:'testing123'});
            assert.equal(a.status,201);
            assert.equal(b.status,201);
            const goal=await request('goals',{title:'Test',domain:'English'},a.cookie);
            assert.equal(goal.status,201);
            const topic=await request('topics',{goalId:goal.data.id,title:'Private'},a.cookie);
            assert.equal(topic.status,201);
            const src=await request('sources',{topicId:topic.data.id,title:'Lesson',body:'Some body with enough content'},a.cookie);
            assert.equal(src.status,201);
            const url='sources/'+src.data.id+'/artifacts?kind=reading_aid&scope=all';
            assert.equal((await request(url)).status,401);
            assert.equal((await request(url,undefined,b.cookie)).status,404);
            const owner=await request(url,undefined,a.cookie);
            assert.equal(owner.status,200);
            assert.equal(owner.data.total,1);
            assert.deepEqual(owner.data.items,[]);
            console.log('Whole summary ownership and no-login protections passed');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=120 || true
